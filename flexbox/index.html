<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creative Heart Animation Effects</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form>
        <input type="text" placeholder="Name">
        <input type="email" placeholder="Email Address">
        <input type="submit" value="Subscribe">
    </form>
    <div style="display: flex; align-items: center; justify-content: center; height: 100vh;">
        <div style="width: 100%; background-color: red;">子元素</div>
    </div>
    <div style="display: flex; align-items: center; justify-content: center; height: 100vh;">
        <div style="width: 100vmin; background-color: rgb(33, 196, 87);">子元素</div>
    </div>
    <div style="display: flex; align-items: center; justify-content: center; height: 100vh;">
        <div style="width: 100vmax; background-color: rgb(33, 196, 87);">子元素</div>
    </div>
    <p>差异在于宽度单位的参照物不同：% 相对于父元素，而 vmin 相对于视口</p>
    <div class="base-container">
        <div class="circle"></div>
        <div class="triangle"></div>
        <div class="star"></div>
        <div class="heart"></div>
        <div class="oval"></div>
        <div class="irregular-sharp"></div>
        <div class="rounded-rectangle"></div>
        <div class="chamfered-rectangle"></div>
        <div class="semicircular"></div>
        <div class="fly-paper-plane"></div>
        <div class="water-drop"></div>
        <div class="irregular-rounded-hexagon"></div>
        <div class="love-heart-frame"></div>
        <div class="laser-sword"></div>
        <div class="wave"></div>
        <div class="bottomless-button"></div>
        <div class="magic-frame"></div>
    </div>
</body>
</html>
