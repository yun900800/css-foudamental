<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>三态菜单按钮</title>
    <link rel="stylesheet" href="menu-button.css">
</head>
<body>

    <p>点击按钮可在：初始 (0) -> 打开 (1) -> 警告 (2) -> 初始 (0) 之间切换</p>
    
    <div id="menu-button" class="menu-button">
        <div class="line line-1"></div>
        <div class="line line-2"></div>
        <div class="line line-3"></div>
    </div>

    <script>
        const button = document.getElementById('menu-button');
        let state = 0; // 0: 初始, 1: 打开, 2: 警告

        button.addEventListener('click', () => {
            // 移除所有状态类
            button.classList.remove('is-open', 'is-warning');

            state = (state + 1) % 3; // 状态循环：0 -> 1 -> 2 -> 0

            if (state === 1) {
                // 切换到打开状态 (汉堡包 -> X)
                button.classList.add('is-open');
            } else if (state === 2) {
                // 切换到警告状态 (X -> !)
                button.classList.add('is-warning');
            }
            
            // state === 0 时，没有特殊类名，自然回到 .menu-button 的默认样式
        });
    </script>
</body>
</html>
