<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>基本的比例封面播放器</title>
  <style>
    /* 外部容器，保持特定比例 */
.cover-player {
  position: relative;
  width: 100%;
  padding-top: 56.25%; /* 16:9比例 */
  background-image: url('https://img0.baidu.com/it/u=694832972,884680727&fm=253&fmt=auto&app=120&f=JPEG?w=1422&h=800'); /* 背景图 */
  background-size: cover; /* 背景图覆盖容器 */
  background-position: center; /* 背景图居中 */
}

.cover-content {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%); /* 使内容居中 */
  text-align: center;
  color: white;
}

.cover-content h1 {
  font-size: 2.5em;
  margin-bottom: 20px;
}

.cover-content button {
  padding: 10px 20px;
  font-size: 1.2em;
  background-color: #f4f4f4;
  color: #333;
  border: none;
  border-radius: 5px;
  cursor: pointer;
}

.cover-content button:hover {
  background-color: #ddd;
}


/* 外部容器 */
.video-cover-player {
  position: relative;
  width: 100%;
  padding-top: 56.25%; /* 保持16:9比例 */
  overflow: hidden;
}

/* 背景视频 */
.video-background {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover; /* 确保视频填充整个容器 */
}

/* 内容区域 */
.video-content {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  color: white;
}

.video-content h1 {
  font-size: 3em;
  margin-bottom: 20px;
}

.video-content button {
  padding: 15px 30px;
  font-size: 1.5em;
  background-color: rgba(255, 255, 255, 0.8);
  color: #333;
  border: none;
  border-radius: 5px;
  cursor: pointer;
}

.video-content button:hover {
  background-color: rgba(255, 255, 255, 1);
}

.cover-player-with-video {
  position: relative;
  width: 100%;
  padding-top: 56.25%; /* 保持16:9比例 */
  overflow: hidden;
}

/* 背景视频 */
.cover-video-background video {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* 内容区域 */
.cover-content {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  color: white;
}

.cover-content h1 {
  font-size: 3em;
  margin-bottom: 20px;
}

.cover-content p {
  font-size: 1.5em;
  margin-bottom: 20px;
}

.cover-content button {
  padding: 15px 30px;
  font-size: 1.5em;
  background-color: rgba(255, 255, 255, 0.8);
  color: #333;
  border: none;
  border-radius: 5px;
  cursor: pointer;
}

.cover-content button:hover {
  background-color: rgba(255, 255, 255, 1);
}



  </style>
</head>
<body>
  
    <div class="cover-player">
        <div class="cover-content">
          <h1>播放我的视频</h1>
          <button>点击播放</button>
        </div>
      </div>
      <div class="video-cover-player">
        <video class="video-background" autoplay muted loop>
          <source src="https://www.w3schools.com/html/movie.mp4" type="video/mp4">
          Your browser does not support the video tag.
        </video>
        <div class="video-content">
          <h1>体验精彩内容</h1>
          <button onclick="document.querySelector('.video-background').play()">点击播放</button>
        </div>
      </div>
      

      <div class="cover-player-with-video">
        <div class="cover-video-background">
          <video autoplay muted loop>
            <source src="https://www.w3schools.com/html/movie.mp4" type="video/mp4">
            Your browser does not support the video tag.
          </video>
        </div>
        <div class="cover-content">
          <h1>超酷的封面播放器</h1>
          <p>播放背景视频，体验更生动的视觉效果</p>
          <button onclick="document.querySelector('.cover-video-background video').play()">点击播放</button>
        </div>
      </div>
</body>
</html>
