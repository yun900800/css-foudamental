    <script>
      const containers = document.querySelectorAll('.book-container');
      for (const container of containers) {
        const imgAlt = getComputedStyle(container).getPropertyValue('--img-alt').trim().replace(/^['"]|['"]$/g, '');
        const imgSrc = getComputedStyle(container).getPropertyValue('--img-url').trim().replace(/^['"]|['"]$/g, '');
        const bookLink = getComputedStyle(container).getPropertyValue('--book-link').trim().replace(/^['"]|['"]$/g, '');
        const img = container.querySelector('img');
        img.alt = imgAlt;
        img.src = imgSrc;
        container.href = bookLink;
      }
    </script>
