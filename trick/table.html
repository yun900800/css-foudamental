<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>
    表格列宽自适应
    响应式横幅

卡片流网格

比例封面播放器

微交互弹性布局

等高卡片流式排列
</title>
  <style>
    

    .data-table {
  border-collapse: collapse;
  width: 100%;
}
.data-table th,
.data-table td {
  border: 1px solid #ccc;
  padding: 8px 12px;
  text-align: left;
}

/* 核心：根据内容自适应最小宽度 */
.data-table th,
.data-table td {
  width: min-content;
  white-space: nowrap; /* 关键：不换行，撑开 */
}

.btn-group {
  display: flex;
  gap: 20px;
}
.adaptive-btn {
  width: min-content; /* 关键点：自适应宽度 */
  min-height: 40px; /* 设置最小高度，避免过于扁平 */
  padding: 8px 12px;
  background-color: #4CAF50;
  color: white;
  border: none;
  border-radius: 6px;
  font-size: 16px;
  line-height: 1.5; /* 使按钮的文字垂直居中 */
}

.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); /* 自动适应每列的宽度 */
  gap: 16px; /* 卡片之间的间距 */
}

.card-grid .card {
  background-color: #f4f4f4;
  padding: 16px;
  border-radius: 8px;
  box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
  text-align: center;
}

.card-container {
  display: flex;
  flex-wrap: wrap;
  gap: 16px; /* 卡片之间的间距 */
  margin-top: 24px; 
}

.card-container .card {
  flex: 1 1 200px; /* flex-grow: 1, flex-shrink: 1, flex-basis: 200px */
  background-color: #f4f4f4;
  padding: 16px;
  border-radius: 8px;
  box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
  text-align: center;
}

.card-container1 {
  column-count: 3; /* 自动创建三列 */
  column-gap: 16px; /* 列间距 */
  margin-top: 24px; 
}

.card-container1 .card {
  background-color: #f4f4f4;
  padding: 16px;
  border-radius: 8px;
  box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
  margin-bottom: 16px;
}



  </style>
</head>
<body>
    <table class="data-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>用户名</th>
            <th>注册时间</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>1</td>
            <td>小明</td>
            <td>2025-04-27 12:30:00</td>
            <td><button>查看</button></td>
          </tr>
          <tr>
            <td>2</td>
            <td>超级超级超级长的用户名测试一下</td>
            <td>2025-04-27 13:00:00</td>
            <td><button>编辑</button></td>
          </tr>
        </tbody>
      </table>
      <div class="btn-group">
        <button class="adaptive-btn">短文</button>
        <button class="adaptive-btn">这是一段超长的文字</button>
    </div> 

    <div class="card-grid">
        <div class="card">卡片1</div>
        <div class="card">卡片2</div>
        <div class="card">卡片3</div>
        <div class="card">卡片4</div>
        <div class="card">卡片5</div>
        <div class="card">卡片6</div>
      </div>

      <div class="card-container">
        <div class="card">卡片1</div>
        <div class="card">卡片2</div>
        <div class="card">卡片3</div>
        <div class="card">卡片4</div>
        <div class="card">卡片5</div>
        <div class="card">卡片6</div>
      </div>

      <div class="card-container1">
        <div class="card">卡片1</div>
        <div class="card">卡片2</div>
        <div class="card">卡片3</div>
        <div class="card">卡片4</div>
        <div class="card">卡片5</div>
        <div class="card">卡片6</div>
      </div>
      
      
</body>
</html>
