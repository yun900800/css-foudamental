<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css" />
    <title>Color Table</title>
</head>
<body>
    <div class="flip-container">
        <div class="flipper">
            <div class="front">
            正面内容
            </div>
            <div class="back">
            背面内容
            </div>
        </div>
    </div>
    <div class="clipped-circle"></div>
    <div class="clipped-star"></div>

    <div class="image-container">
        <img src="https://picsum.photos/id/237/400/300" alt="可爱的小狗" class="clipped-circle">
        <img src="https://picsum.photos/id/1080/400/300" alt="美丽的风景" class="clipped-hexagon">
    </div>

    <div class="card-container">
        <div class="card clipped-triangle">
            <h3>三角形卡片</h3>
            <p>这是一个用 clip-path 裁剪的三角形卡片。</p>
        </div>
        <div class="card clipped-rhombus">
            <h3>菱形卡片</h3>
            <p>这是一个用 clip-path 裁剪的菱形卡片。</p>
        </div>
    </div>
</body>
</html>
