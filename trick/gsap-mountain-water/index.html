<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>山水意境进入动画</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #f0f4f5;
      overflow: hidden;
      height: 100%;
      font-family: "KaiTi", "STKaiti", serif;
    }
    svg {
      width: 100%;
      height: 100vh;
      display: block;
    }
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .title {
      position: absolute;
      top: 40%;
      width: 100%;
      text-align: center;
      font-size: 2.5em;
      color: #333;
      opacity: 0;
      letter-spacing: 0.1em;
    }
  </style>
</head>
<body>

<div class="title">山水之间</div>

<svg viewBox="0 0 800 400" preserveAspectRatio="xMidYMid slice">
  <!-- 背景山 -->
  <path id="bgMountain" d="M0,300 Q200,100 400,300 T800,300 L800,400 L0,400 Z" fill="#b0c4b1"/>
  <!-- 前景山 -->
  <path id="fgMountain" d="M0,350 Q300,150 600,350 T800,350 L800,400 L0,400 Z" fill="#6d8b74" opacity="0"/>
  <!-- 薄雾 -->
  <g id="fog" opacity="0">
    <ellipse cx="200" cy="200" rx="150" ry="40" fill="white" fill-opacity="0.3"/>
    <ellipse cx="600" cy="250" rx="180" ry="50" fill="white" fill-opacity="0.3"/>
  </g>
</svg>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script>
  const timeline = gsap.timeline();

  // 背景山淡入
  timeline.from("#bgMountain", {
    duration: 2,
    opacity: 0,
    y: 50,
    ease: "power2.out"
  });

  // 薄雾出现并漂移
  timeline.to("#fog", {
    duration: 2,
    opacity: 1,
    ease: "sine.inOut"
  }, "-=1") // 提前开始

  .to("#fog", {
    duration: 8,
    x: 100,
    repeat: -1,
    yoyo: true,
    ease: "sine.inOut"
  }, "-=2");

  // 前景山上升出现
  timeline.to("#fgMountain", {
    duration: 2.5,
    opacity: 1,
    y: -30,
    ease: "power2.out"
  }, "-=1.5");

  // 文字淡入
  timeline.to(".title", {
    duration: 3,
    opacity: 1,
    y: -20,
    ease: "power2.out"
  }, "-=1");
</script>
</body>
</html>
