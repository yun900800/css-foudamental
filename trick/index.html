<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>利用 margin:auto + position: absolute 实现居中</title>
  <style>
    .box {
        position: absolute;
        top: 0; left: 0; bottom: 0; right: 0;
        margin: auto;
        width: 100px;
        height: 100px;
        background: lightblue;
        border-radius: 50%;
    }

    .bottom {
        top: calc(100% - 100px);
        background: lightgreen
    }

    .top {
        bottom: calc(100% - 100px);
        background: rgb(12, 228, 12)
    }

    .left {
        right: calc(100% - 100px);
        background: rgb(110, 163, 224)
    }
    .right {
        left: calc(100% - 100px);
        background: rgb(148, 47, 179)
    }

    .cover-card {
  width: 100%;
  aspect-ratio: 16 / 9; /* 新方法，一行搞定比例 */
  position: relative;
  overflow: hidden;
  border-radius: 12px;
}
.cover-card img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.cover-card .title {
  position: absolute;
  bottom: 10px;
  left: 10px;
  color: white;
  font-size: 18px;
  text-shadow: 0 2px 4px rgba(0,0,0,0.6);
}

.button-group {
  display: inline-flex;
}
.button-group button {
  margin-right: -6px; /* 负margin让按钮更靠近 */
  padding: 10px 20px;
  font-size: 16px;
}

.btn-group1 {
  display: flex;
  gap: 20px;
  width:100%
}
.adaptive-btn {
  width: min-content; /* 关键点！ */
  padding: 8px 12px;
  background-color: #4CAF50;
  color: white;
  border: none;
  border-radius: 6px;
  font-size: 16px;
}



  </style>
</head>
<body>
  <div class="box">
    this is a center box; 
  </div>
  <div class="box bottom">
    this is a bottom box; 

  </div>
  <div class="box top">
    this is a top box; 
  </div>
  <div class="box right">
    this is a left box; 

  </div>
  <div class="box left">
    this is a right box; 
  </div>

  <div style="width: 50%;">
    <div class="cover-card">
        <img src="https://img2.baidu.com/it/u=647265987,1253183144&fm=253&fmt=auto&app=138&f=JPEG?w=800&h=500" alt="封面">
        <div class="title">封面标题</div>
    </div>
      
  </div>
  <div style="width: 50%;">
    <div class="button-group">
        <button>按钮1</button>
        <button>按钮2</button>
    </div>      
  </div>
  <div style="width: 50%;">
    <div class="btn-group1">
        <button class="adaptive-btn">短文</button>
        <button class="adaptive-btn">这是一段超长的文字</button>
    </div>
  </div>
  
</body>
</html>
