
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>旋转条纹背景</title>
    <style>
        :root {
            --a: 0deg;
        }

        @property --a {
            syntax: '<angle>';
            inherits: false;
            initial-value: 0deg;
        }

        @keyframes animate {
            0% {
                --a: 0deg;
            }
            100% {
                --a: 360deg;
            }
        }

        .container {
            position: relative;
            width: 300px;
            height: 300px;
            margin: 50px auto;
            background-color: #f0f0f0;
            border-radius: 20px;
            overflow: hidden;
        }

        .container::before {
            position: absolute;
            content: '';
            width: 100%;
            height: 100%;
            background: repeating-conic-gradient(
                from var(--a),
                #45f3ff 0%,
                #45f3ff 10%,
                transparent 10%,
                transparent 80%,
                #45f3ff 100%
            );
            border-radius: 20px;
            animation: animate 2.5s linear infinite;
        }
    </style>
</head>
<body>
    <div class="container"></div>
</body>
</html>
