<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>边距折叠问题</title>
  <style>
    .container {
      display: flow-root; 
      /* 使用 flow-root 来防止边距折叠 */
      border: 2px solid #333;
      padding: 10px;
    }
    .item {
      float: left;
      width: 100px;
      height: 100px;
      background-color: lightcoral;
      margin: 20px;
    }
    .text {
      margin-top: 50px;
      background-color: lightyellow;
      padding: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="item"></div>
    <div class="text">Some text here!</div>
  </div>
</body>
</html>
