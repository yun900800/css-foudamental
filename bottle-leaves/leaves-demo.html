<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaves demo </title>
    <link rel="stylesheet" href="leaves-style.css">
</head>
<body>
    <div class="main">
        <div class="clover">
            <div class="leaves">
                <i class="leave angleN"></i>
                <i class="leave angleW"></i>
                <i class="leave angleS"></i>
                <i class="leave angleE"></i>
            </div>
            <i class="branch"></i>
        </div>
        <div class="clover">
            <div class="leaves">
                <i class="leave-three angle1"></i>
                <i class="leave-three angle2"></i>
                <i class="leave-three angle3"></i>
            </div>
            <i class="branch"></i>
        </div>
        <div class="clover">
            <div class="leaves">
                <i class="leave-three angle1"></i>
                <i class="leave-three angle2"></i>
                <i class="leave-three angle3"></i>
            </div>
            <i class="branch"></i>
        </div>
        <div class="clover">
            <div class="leaves">
                <i class="leave-three angle1"></i>
                <i class="leave-three angle2"></i>
                <i class="leave-three angle3"></i>
            </div>
            <i class="branch"></i>
        </div>

        <div class="clover">
            <div class="leaves" style="--leaves-width:160px; --leaves-height:160px;">
                <div class="leave-new angleN">
                </div>
                <div class="leave-new angleS"> 
                </div>
                <div class="leave-new angleW">
                </div>
                <div class="leave-new angleE">
                </div>

                <!-- <div class="leave-new" style="background-color: red; left: 0; top: 0;">
                </div>     -->
                
            </div>
            <i class="branch"></i>
        </div>

        <div class="clover">
            <div class="leaves" style="--leaves-width:160px; --leaves-height:160px;">
                <div class="leave-three-new angle1" style="--leave-width:54px;--leave-height:64px;">
                </div>
                <div class="leave-three-new angle2" style="--leave-width:54px;--leave-height:64px;">
                </div>
                <div class="leave-three-new angle3" style="--leave-width:54px;--leave-height:64px;">
                </div>
                <!-- <div class="leave-three-new" style="background-color: red; left: 0; top: 0;">
                </div>     -->
                
            </div>
            <i class="branch"></i>
        </div>
    </div>
</body>
</html>
