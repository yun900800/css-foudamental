<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="input.css" />
  <title>Input Component</title>
</head>

<body>
    <div class="input-group">
        <input type="text" id="username" class="input">
        <label for="username" class="label">用户名</label>
    </div>

    <div class="input-group-animated">
        <input type="email" id="email" class="input-animated">
        <label for="email" class="label-animated">邮箱</label>
        <span class="border"></span>
    </div>

    <div class="input-group-icon">
        <i class="fas fa-user icon"></i> <input type="text" id="fullName" class="input-icon">
        <label for="fullName" class="label-icon">姓名</label>
      </div>
</body>

</html>
