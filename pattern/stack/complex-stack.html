<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stack Layout Card</title>
    <link rel="stylesheet" href="complext-stack.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body>
    <div class="card">
        <img class="avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=1964&auto=format&fit=crop" alt="User Avatar">

        <div class="info stack">
            <h2 class="name">Ada Lovelace</h2>
            <p class="bio">Passionate coder and designer. Building beautiful and accessible web experiences.</p>
        </div>

        <div class="social-links stack horizontal">
            <a href="#"><i class="ri-github-fill"></i></a>
            <a href="#"><i class="ri-twitter-x-fill"></i></a>
            <a href="#"><i class="ri-linkedin-box-fill"></i></a>
        </div>

        <div class="actions stack horizontal">
            <button class="btn primary">Follow</button>
            <button class="btn secondary">Message</button>
        </div>
    </div>
</body>
</html>
