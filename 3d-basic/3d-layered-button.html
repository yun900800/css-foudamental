
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 3D Background Animation</title>
    <link rel="stylesheet" href="3d-layered-button.css">
</head>
<body>
    <div class="scene">
        <div class="layered-btn">
            <!-- 这里的每个 span 代表一个不带厚度的 2D 图层，通过堆叠形成 3D 按钮 -->
            <span style="--i: 0">3D BUTTON</span>
            <span style="--i: 1">3D BUTTON</span>
            <span style="--i: 2">3D BUTTON</span>
            <span style="--i: 3">3D BUTTON</span>
            <span style="--i: 4">3D BUTTON</span>
            <span style="--i: 5">3D BUTTON</span>
            <span style="--i: 6">3D BUTTON</span>
            <span style="--i: 7">3D BUTTON</span>
        </div>
    </div>
</body>
</html>
