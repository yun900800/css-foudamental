<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>inline-block创建导航菜单</title>
    <link rel="stylesheet" href="style1.css">
</head>
<body>
    <ul class="nav">
        <li><a href="#">首页</a></li>
        <li><a href="#">关于我们</a></li>
        <li><a href="#">服务</a></li>
        <li><a href="#">联系我们</a></li>
    </ul>
    <div class="image-text">
        <img src="http://gips3.baidu.com/it/u=3886271102,3123389489&fm=3028&app=3028&f=JPEG&fmt=auto?w=1280&h=960" alt="Placeholder" class="image" />
        <p>这是一些文字，图片将会与文字对齐。使用 inline-block 可以让它们在同一行内显示，且允许更多的排版控制。</p>
    </div>
    <div class="table"><div class="row"><div class="cell">姓名</div><div class="cell">年龄</div><div class="cell">城市</div></div><div class="row"><div class="cell">张三</div><div class="cell">25</div><div class="cell">北京</div></div></div>
    <div class="wrapper">
        <button class="btn">按钮 1</button>
        <button class="btn">按钮 2</button>
        <button class="btn">按钮 3</button>
    </div>
    
</body>
</html>
