<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>比例盒子布局合集</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  body {
    background: #f9f9f9;
    padding: 20px;
    font-family: Arial, sans-serif;
  }
  .parent {
    width: auto;
  }
  .child {
    width: 50%;
    background-color: aquamarine;
  }

  .ratio-box {
  width: 100%;
  /* 高度是宽度的56.25%，也就是16:9比例 */
  padding-top: 56.25%;
  position: relative;
  background: #a0c4ff;
  overflow: hidden;
  border-radius: 12px;
}

.ratio-box .content {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  font-weight: bold;
  color: white;
}

</style>
</head>

<body>

    <div class="parent">
        <div class="child">test</div>
    </div>
    <div style="height: auto; background: lightgray;">
        <div style="height: 50%; background: lightblue;">
          我想要50%的高度
        </div>
      </div>
      <div class="ratio-box">
        <div class="content">内容</div>
      </div>
      
</body>
</html>
