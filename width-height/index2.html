<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自适应正方形网格</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  body {
    background: #f5f5f5;
    padding: 20px;
    font-family: sans-serif;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 20px;
  }
  .card {
    position: relative;
    width: 100%;
    padding-top: 100%; /* 正方形技巧！ */
    background: #4f86f7;
    border-radius: 12px;
    overflow: hidden;
    transition: transform 0.3s ease, background 0.3s ease;
    cursor: pointer;
  }
  .card:hover {
    transform: scale(1.05);
    background: #3a6ad9;
  }
  .card-content {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: bold;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
  }
</style>
</head>
<body>

<h1 style="margin-bottom: 20px;">自适应正方形网格布局</h1>

<div class="grid">
  <div class="card"><div class="card-content">卡片 1</div></div>
  <div class="card"><div class="card-content">卡片 2</div></div>
  <div class="card"><div class="card-content">卡片 3</div></div>
  <div class="card"><div class="card-content">卡片 4</div></div>
  <div class="card"><div class="card-content">卡片 5</div></div>
  <div class="card"><div class="card-content">卡片 6</div></div>
  <div class="card"><div class="card-content">卡片 7</div></div>
  <div class="card"><div class="card-content">卡片 8</div></div>
</div>

</body>
</html>
