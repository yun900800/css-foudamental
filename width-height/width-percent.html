<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>width or height percent </title>
  <style>
    /* 
     * 如果box-sizing使用下面的属性,那么父元素的宽度300px = 子元素的content270px + 5px *2 + 10px *2
     * 300px = 270px + 10px + 10px + 5px + 5px
     * 反之，如果没有使用box-sizing属性，那么父元素的宽度330px = 子元素的content300px + 5px *2 + 10px *2
     */
    * {
        box-sizing: border-box;
    }
  </style>
</head>
<body style="display: flex; gap: 8px;">
    <div style="width: 300px; padding: 10px; border: 5px solid black;">
        <div style="width: 100%; box-sizing: border-box; background: lightblue;">
          我是子元素
        </div>
    </div>
    <div style="width: 400px; height: 400px; background: #eee;">
        <div style="margin-top: 10%; padding-left: 10%; background: lightblue;">
          Hello
        </div>
    </div>
    <div style="width: 200px; background: lightgray; position: relative;">
        <div style="width: 100%; padding-top: 100%; background: lightblue; position: absolute; top: 0; left: 0; overflow: hidden;">
          我是自适应正方形
        </div>
      </div>
      
      <div style="width: 200px; background: lightgray; position: relative;">
        <div style="width: 100%; padding-top: 100%; background: lightblue; position: absolute; top: 0; left: 0;">
        </div>
        <div style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;">
          我是自适应正方形
          我是自适应正方形
          我是自适应正方形
        </div>
      </div>

      <div style="width: 200px; background: lightgray; position: relative;">
        <div style="width: 100%; padding-top: 100%; background: lightblue; position: relative;">
          <div style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;">
            我是自适应正方形
          </div>
        </div>
      </div>
      
      
</body>
</html>
