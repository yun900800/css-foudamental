<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>浮动导致父元素塌陷</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="parent">
        <div class="float-child">这是一个浮动的子元素</div>
        <p>这是父元素中的文本内容，浮动元素导致了父元素高度塌陷。</p>
        <div class="clearfix"></div>
    </div>
</body>
</html>
