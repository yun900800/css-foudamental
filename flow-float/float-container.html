<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>浮动元素侵入其他元素</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>
    <div class="container">
        <div class="floated">这是一个浮动元素</div>
        <p>这是一段文本内容。</p>
    </div>
    
    <div class="another-container">
        <p>这是另一个容器中的内容。</p>
    </div>
    
</body>
</html>
