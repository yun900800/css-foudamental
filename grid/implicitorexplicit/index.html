    <title>Implicit vs Explicit Grid Lines 心智模型</title>

        :root {
            --img-width: 400px;

        }

        }

        main {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(var(--img-width),1fr)); 
            gap: 12px;
            padding: 20px;
        }

        img {
            display: block;
