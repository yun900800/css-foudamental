<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout Land Grid 线心智模型演示</title>
    <style>
        /* 基础页面样式重置 */
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f5f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* 1. 父容器：定义 4 条线（3 个纵向通道） */
        .grid-container {
            display: grid;
            /* 划分 3 列，比例为 1:1:1，自动产生线 1, 2, 3, 4 */
            grid-template-columns: 1fr 1fr 1fr;
            
            /* 限制最大宽度，方便在大屏上观察 */
            width: 90%;
            max-width: 900px;
            background-color: #ffffff;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.05);
            border-radius: 12px;
        }

        /* 2. 图片元素：认线不认格（跨越线 1 到线 3） */
        .promo-image {
            /* 核心：从 1 号垂直线横跨到 3 号垂直线 */
            grid-column: 1 / 3;
            /* 都在第 1 行 */
            grid-row: 1;

            width: 100%;
            height: 400px;
            object-fit: cover;
            border-radius: 8px;
            /* 加个暗色滤镜让白色文字更显眼 */
            filter: brightness(0.9); 
        }

        /* 3. 文字卡片：认线不认格（跨越线 2 到线 4） */
        .text-card {
            /* 核心：从 2 号垂直线横跨到 4 号垂直线 */
            grid-column: 2 / 4;
            /* 都在第 1 行，因此在 2 到 3 之间与图片完美重叠 */
            grid-row: 1;

            /* 局部控制：让文字在网格里垂直居中 */
            align-self: center; 

            /* 样式设计：白底、阴影，营造悬浮错落感 */
            background: #ffffff;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border-radius: 8px;
            /* 稍微往右提一点层级，确保压在图片上方 */
            position: relative; 
            z-index: 2; 
        }

        /* 文本细节样式 */
        .text-card h2 {
            margin-top: 0;
            font-size: 2rem;
            color: #1d1d1f;
            line-height: 1.2;
        }

        .text-card p {
            color: #86868b;
            line-height: 1.6;
            margin-bottom: 0;
        }

        /* 响应式微调：如果是小屏幕（如手机），我们优雅降级为单列 */
        @media (max-width: 600px) {
            .grid-container {
                grid-template-columns: 1fr; /* 变成只有 1 列 */
                padding: 16px;
            }
            .promo-image {
                grid-column: 1 / -1; /* 占满 */
                height: 250px;
            }
            .text-card {
                grid-column: 1 / -1; /* 占满 */
                margin-top: -40px; /* 向上提，形成上下重叠 */
                padding: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="grid-container">
        
        <img class="promo-image" src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=1000&q=80" alt="森林美景">
        
        <div class="text-card">
            <h2>内在 Web 设计<br>与自由的网格</h2>
            <p>这是 Layout Land 视频里最推崇的排版方式。图片和文字属于同一个行（Row），但通过对网格线（Grid Lines）的精准控制，让它们在中间的通道里发生重叠，既有杂志般的现代设计感，又具备极强的代码韧性。</p>
        </div>

    </div>

</body>
</html>
