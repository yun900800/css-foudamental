<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>响应式 Grid 艺术留白示例</title>
  <style>
    /* 基础样式重置 */
    body {
      margin: 0;
      padding: 20px;
      background-color: #f5f5f7;
      font-family: sans-serif;
    }

    /* ===================================================
       1. 默认样式：小屏幕（手机端）- 铺满、不留白
       =================================================== */
    .grid-container {
      display: grid;
      /* 手机端定义 2 列等宽 */
      grid-template-columns: repeat(2, 1fr);
      /* 行高自适应内容，或者固定一个较小的高度 */
      grid-auto-rows: 140px;
      gap: 10px;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* 亮黄色方块 */
    .item {
      background-color: #ffe600;
      border-radius: 6px;
      /* 加点阴影和过渡动画，方便观察 */
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      transition: all 0.4s ease;
    }

    /* 手机端不需要复杂的二维坐标，让它们按默认的“从左到右”自动填满即可 */
    /* 仅让第5个元素（长条）在手机端横跨2列，保持视觉节奏 */
    .item-5 { grid-column: span 2; }
    /* 仅让第6个元素（大方块）在手机端横跨2列 */
    .item-6 { grid-column: span 2; grid-row: span 2; }


    /* ===================================================
       2. 媒体查询：大屏幕（电脑端，屏幕宽度 >= 768px）- 解锁艺术留白
       =================================================== */
    @media (min-width: 768px) {
      .grid-container {
        /* 解锁为 5 列 4 行的专属坐标系 */
        grid-template-columns: repeat(5, 1fr);
        grid-template-rows: repeat(4, 150px);
        gap: 20px;
      }

      /* 利用二维坐标精准定位，强行空出第4列和特定格子（实现留白） */
      
      /* 第 1 列垂直排满 */
      .item-1 { grid-column: 1; grid-row: 1; }
      .item-2 { grid-column: 1; grid-row: 2; }
      .item-3 { grid-column: 1; grid-row: 3; }
      .item-4 { grid-column: 1; grid-row: 4; }

      /* 第一行的其余两个独立方块 */
      .item-7 { grid-column: 2; grid-row: 1; } 
      .item-8 { grid-column: 5; grid-row: 1; } 

      /* 第二行的横向长条：占第2、3列 */
      .item-5 { 
        grid-column: 2 / span 2; 
        grid-row: 2; 
      }

      /* 核心巨型大方块：占第2、3列的第3、4行 */
      .item-6 { 
        grid-column: 2 / span 2; 
        grid-row: 3 / span 2; 
      }

      /* 最后一列中间的方块 */
      .item-9 { grid-column: 5; grid-row: 3; }

      /* 此时：第4列整列全空，第5列的第2、4行全空，大面积留白瞬间铺开！ */
    }
  </style>
</head>
<body>

  <div class="grid-container">
    <div class="item item-1"></div>
    <div class="item item-2"></div>
    <div class="item item-3"></div>
    <div class="item item-4"></div>
    <div class="item item-5"></div>
    <div class="item item-6"></div>
    <div class="item item-7"></div>
    <div class="item item-8"></div>
    <div class="item item-9"></div>
  </div>

</body>
</html>
