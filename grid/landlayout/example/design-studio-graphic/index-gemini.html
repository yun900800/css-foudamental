<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Twopots Design Studio</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <main class="poster-container">
    <!-- 核心艺术展示区 -->
    <div class="art-stage">
      
      <!-- 1. 核心艺术图形（你发给我的第二幅图） -->
      <div class="graphic-wrapper">
        <img src="media/01-004/graphic.jpg" alt="Artistic Number 8 with Flowers" class="hero-img">
      </div>

      <!-- 2. 右下角叠加的纵向艺术文字 -->
      <div class="typography-group">
        <div class="brand-title">
          <span class="word txt-vertical">Twopots</span>
          <span class="word txt-rotated">—— Design</span>
          <span class="word txt-vertical">Studio</span>
        </div>
        
        <!-- 最底部微型版权元数据 -->
        <footer class="meta-footer">
          <p>Xavier Esclusa Trias</p>
          <p>twopots-design.com</p>
          <p>Barcelona</p>
        </footer>
      </div>

    </div>
  </main>

</body>
</html>
